02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5afe9768-8372-4882-b8c2-14fbbd2f5960\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#ffffff}\na{color:#15253A}a:hover{color:#0B1522}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 40px 48px 40px; background: #ffffff; font-family: Inter, system-ui, sans-serif; color: #1C2430; display: flex; flex-direction: column; gap: 16px\" data-canvas-width=\"794\" data-canvas-height=\"1123\">\n\n  <header style=\"display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 14px; border-bottom: 2px solid #15253A\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n      <div style=\"font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5F0E\">Quick Start<\u002Fdiv>\n      <h1 style=\"margin: 0; font-size: 44px; line-height: 1.05; font-weight: 700; color: #15253A; letter-spacing: -0.01em\">What O’Clock<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"font-size: 12px; color: #555E6B; text-align: right; line-height: 1.4\">Your bedside clock with<br>weather and a daily verse<\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 20px; font-weight: 700; color: #15253A\">Getting started<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px\">\n      <div style=\"background: #F5F2EA; border: 1px solid #E3DCCB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <div style=\"width: 30px; height: 30px; border-radius: 15px; background: #15253A; color: #ffffff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center\">1<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 700; color: #15253A\">Plug it in<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.45\">Connect the clock to the power adapter with the supplied cable, then plug it into the wall.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #F5F2EA; border: 1px solid #E3DCCB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <div style=\"width: 30px; height: 30px; border-radius: 15px; background: #15253A; color: #ffffff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center\">2<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 700; color: #15253A\">Join your Wi-Fi<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.45\">Tap your network in the list, type its password, then tap Connect.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #F5F2EA; border: 1px solid #E3DCCB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <div style=\"width: 30px; height: 30px; border-radius: 15px; background: #15253A; color: #ffffff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center\">3<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 700; color: #15253A\">Set your location<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.45\">Type your postcode and pick your suburb. The time, weather and verse then appear by themselves.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 20px; font-weight: 700; color: #15253A\">Using your clock<\u002Fh2>\n    <div style=\"display: flex; gap: 22px; align-items: flex-start\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px; flex: none\">\n        <div style=\"position: relative; width: 384px; height: 218px; border-radius: 10px; overflow: hidden; border: 6px solid #2A2F37\">\n          <img src=\"dd0080de-652b-4855-b02c-c4801cddc012\" alt=\"The clock’s main screen: the time, the date, today’s weather and a Bible verse\" style=\"width: 384px; height: 218px; display: block\">\n          <div style=\"position: absolute; left: 150px; top: 6px; width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; border: 2px solid #ffffff; color: #15253A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center\">1<\u002Fdiv>\n          <div style=\"position: absolute; left: 216px; top: 22px; width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; border: 2px solid #ffffff; color: #15253A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center\">2<\u002Fdiv>\n          <div style=\"position: absolute; left: 344px; top: 168px; width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; border: 2px solid #ffffff; color: #15253A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center\">3<\u002Fdiv>\n          <div style=\"position: absolute; left: 338px; top: 20px; width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; border: 2px solid #ffffff; color: #15253A; font-weigh
